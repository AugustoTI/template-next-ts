pre-commit:
  parallel: true
  jobs:
    - name: running-eslint
      glob: '*.{ts,tsx,mts,cts}'
      run: pnpm lint:base src
      stage_fixed: true

    - name: running-prettier
      glob: '*.{css,json,md,mdx}'
      run: pnpm format:base {staged_files}
      stage_fixed: true

    - name: running-type-check
      run: pnpm tsc

    - name: running-tests
      glob: '*.{tsx,ts}'
      run: pnpm vitest related --run --passWithNoTests {staged_files}

commit-msg:
  jobs:
    - run: pnpm commitlint --edit

pre-push:
  jobs:
    - run: pnpm build
